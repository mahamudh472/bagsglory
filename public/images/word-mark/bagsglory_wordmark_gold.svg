<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F5F20"/>
      <stop offset="28%" stop-color="#D9A441"/>
      <stop offset="50%" stop-color="#FFE39A"/>
      <stop offset="72%" stop-color="#C88A2E"/>
      <stop offset="100%" stop-color="#8F5F20"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Transparent background -->
  <g fill="url(#gold)" filter="url(#softShadow)">
    <text x="600" y="190"
          text-anchor="middle"
          font-family="Montserrat, Avenir, Helvetica, Arial, sans-serif"
          font-size="116"
          font-weight="500"
          letter-spacing="18">
      BAGSGLORY
    </text>
    <text x="600" y="268"
          text-anchor="middle"
          font-family="Montserrat, Avenir, Helvetica, Arial, sans-serif"
          font-size="28"
          font-weight="400"
          letter-spacing="12">
      CARRY YOUR STORY
    </text>
  </g>
</svg>